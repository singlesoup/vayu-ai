# Publish the Reflect-style UI preview (dummy data, no Tauri) to GitHub Pages.
# Source branch: design_upgrades only — does not deploy main.
name: Design UI → GitHub Pages

on:
  push:
    branches: [design_upgrades]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-design-upgrades
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static UI preview
        env:
          VITE_UI_PREVIEW: "true"
          VITE_PAGES_BASE: /vayu-ai/
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
